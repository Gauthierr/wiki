# Déploiement automatique : tout push sur main redéploie le projet sur le VPS via SSH.
# Secrets à définir dans GitHub : Settings > Secrets and variables > Actions
#   SSH_HOST      -> IP/hostname du VPS
#   SSH_USER      -> utilisateur SSH de déploiement (ex. deployer)
#   SSH_KEY       -> clé privée de déploiement (contenu complet du fichier)
#   PROJECT_PATH  -> dossier du projet sur le VPS (ex. /opt/stacks/projet1)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # permet aussi un déclenchement manuel depuis l'onglet Actions

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true   # un nouveau push annule un déploiement en cours

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement SSH sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
