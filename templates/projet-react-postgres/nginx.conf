# Config nginx pour une Single Page App React.
# Sert les fichiers statiques et renvoie index.html pour les routes côté client.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Routage SPA : toute route inconnue retombe sur index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets versionnés (hash dans le nom de fichier).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
