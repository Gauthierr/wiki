# Stack Traefik — reverse proxy unique du VPS (ports 80/443).
# À déployer une seule fois dans /opt/stacks/traefik/.
# Prérequis : `docker network create web` et un fichier acme.json (chmod 600).

services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP (redirigé vers HTTPS par traefik.yml)
      - "443:443"   # HTTPS
    volumes:
      # Lecture seule du socket Docker : Traefik découvre les conteneurs et leurs labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./acme.json:/acme.json          # stockage des certificats Let's Encrypt
    networks:
      - web
    labels:
      - "traefik.enable=true"

      # --- Dashboard (optionnel) sur https://traefik.mondomaine.com ---
      # Remplace le domaine, ou commente ce bloc pour ne pas exposer le dashboard.
      - "traefik.http.routers.dashboard.rule=Host(`traefik.mondomaine.com`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth"

      # Basic auth pour protéger le dashboard.
      # Génère la valeur avec :  htpasswd -nb admin 'motdepasse'
      # IMPORTANT : dans un fichier compose, double chaque '$' en '$$'.
      - "traefik.http.middlewares.auth.basicauth.users=admin:$$apr1$$REMPLACE_MOI"

networks:
  web:
    external: true   # créé une fois via : docker network create web
