name: Agenda quotidien -> reMarkable

on:
  schedule:
    # 05:00 UTC chaque jour ≈ 07:00 heure de Paris (été). Ajustez si besoin.
    - cron: "0 5 * * *"
  workflow_dispatch: {}  # permet de lancer manuellement depuis l'onglet Actions

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Configurer Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Installer rmapi
        run: |
          go install github.com/ddvk/rmapi@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Écrire la configuration rmapi
        run: |
          mkdir -p "$HOME/.config/rmapi"
          printf '%s' "${{ secrets.RMAPI_CONF }}" > "$HOME/.config/rmapi/rmapi.conf"

      - name: Générer et publier l'agenda
        env:
          ICS_OUTLOOK: ${{ secrets.ICS_OUTLOOK }}
          ICS_GMAIL: ${{ secrets.ICS_GMAIL }}
          ICS_INFOMANIAK: ${{ secrets.ICS_INFOMANIAK }}
        run: python -m src.main

      - name: Archiver le PDF (artefact, 7 jours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-pdf
          path: out/*.pdf
          if-no-files-found: ignore
          retention-days: 7
